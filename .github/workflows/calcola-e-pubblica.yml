name: Calcola GW e aggiorna dashboard

on:
  push:
    branches:
      - main
      - fix/gameweek-retrieval
    paths:
      - 'formazioni/formazioni_GW*.xlsx'
      - 'lib/matchday.js'
      - '.github/workflows/calcola-e-pubblica.yml'

  workflow_dispatch:
    inputs:
      gw:
        description: 'Numero giornata ufficiale Serie A (1-38)'
        required: true
        type: string
      dry_run:
        description: 'Solo verifica dati, nessuna pubblicazione'
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  calcola:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test unitari matching
        run: node --test test/matchday.test.js test/playerIdentity.test.js

      - name: Trova GW
        id: gw
        env:
          MANUAL_GW: ${{ inputs.gw }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            GW="$MANUAL_GW"
          elif [[ "$GITHUB_REF" != refs/heads/main ]]; then
            GW=12
          else
            mapfile -t FILES < <(git diff --name-only --diff-filter=AM "$BEFORE" "$GITHUB_SHA" -- formazioni/ | grep -E '^formazioni/formazioni_GW[0-9]+\.xlsx$' || true)
            if [[ ${#FILES[@]} != 1 ]]; then
              echo "Caricare una sola giornata per push; per ricalcoli usare avvio manuale."
              exit 1
            fi
            GW="$(basename "${FILES[0]}" | sed -E 's/formazioni_GW([0-9]+)\.xlsx/\1/')"
          fi
          [[ "$GW" =~ ^([1-9]|[1-2][0-9]|3[0-8])$ ]] || exit 1
          FILE="formazioni/formazioni_GW${GW}.xlsx"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "gw=$GW" >> "$GITHUB_OUTPUT"

      - name: Calcola Fantastats
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
          GW: ${{ steps.gw.outputs.gw }}
          FILE: ${{ steps.gw.outputs.file }}
          DRY_RUN: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != refs/heads/main || "$DRY_RUN" == true ]]; then
            EXTRA=()
            if [[ "$GW" == 12 ]]; then EXTRA+=(--expect-malen=4); fi
            node calcola.js "$FILE" --dry-run "${EXTRA[@]}"
          else
            test -f "$FILE"
            node calcola.js "$FILE"
          fi

      - name: Confronto ID listone
        if: github.ref == 'refs/heads/fix/gameweek-retrieval'
        run: node test/check-listone.js

      - name: Diagnostica Fantastats7 (sola lettura)
        if: github.ref == 'refs/heads/fix/gameweek-retrieval' && hashFiles('formazioni/formazioni_GW12.xlsx') != ''
        run: node test/diagnose-fs7.js

      - name: Test completo GW12 con Excel (solo branch correttivo)
        if: github.ref == 'refs/heads/fix/gameweek-retrieval' && steps.gw.outputs.gw == '12'
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f formazioni/formazioni_GW12.xlsx ]]; then
            echo "Caricare formazioni/formazioni_GW12.xlsx nel branch correttivo per il test completo."
            exit 0
          fi
          mkdir -p test-results
          node calcola.js formazioni/formazioni_GW12.xlsx --out=test-results/risultati_GW12.xlsx --statsOut=test-results/statistiche_GW12.xlsx
          node --input-type=module - <<'NODE'
          import XLSX from 'xlsx'
          import assert from 'node:assert/strict'
          const wb = XLSX.readFile('test-results/risultati_GW12.xlsx')
          const rows = XLSX.utils.sheet_to_json(wb.Sheets._dati_giornate)
          assert(rows.length > 0 && rows.every(r => r.gw === 12 && Number.isFinite(r.punteggio)))
          const input = XLSX.readFile('formazioni/formazioni_GW12.xlsx')
          for (const fanta of ['Classic','Mantra']) {
            const users = new Set(XLSX.utils.sheet_to_json(input.Sheets[fanta]).map(r=>String(r.utente).trim()))
            const result = rows.filter(r=>r.fanta===fanta)
            assert.equal(new Set(result.map(r=>r.modalita)).size,5)
            assert.equal(result.length,users.size*5)
            for (const user of users) assert.equal(result.filter(r=>r.utente===user).length,5)
          }
          console.log('GW12_SCORES_JSON '+JSON.stringify(rows))
          const stats = XLSX.readFile('test-results/statistiche_GW12.xlsx')
          const malen = XLSX.utils.sheet_to_json(stats.Sheets._per_gw).filter(r=>String(r.nome).toLowerCase().includes('malen'))
          assert.equal(malen.length,1)
          assert.equal(malen[0].gol,4)
          console.log('GW12_MALEN_JSON '+JSON.stringify(malen))
          NODE

      - name: Salva Excel test GW12 come artifact
        if: github.ref == 'refs/heads/fix/gameweek-retrieval' && steps.gw.outputs.gw == '12' && hashFiles('test-results/risultati_GW12.xlsx') != ''
        uses: actions/upload-artifact@v4
        with:
          name: risultati-test-GW12
          path: test-results/
          if-no-files-found: error

      - name: Rigenera dashboard data
        if: github.ref == 'refs/heads/main' && inputs.dry_run != true
        run: node genera-dashboard-data.js

      - name: Salva risultati aggiornati nella repo
        if: github.ref == 'refs/heads/main' && inputs.dry_run != true
        shell: bash
        run: |
          git config user.name "Fantastats Bot"
          git config user.email "actions@github.com"

          git add fantastats_stagione.xlsx
          git add statistiche_giocatori.xlsx
          git add dashboard-data.js

          if git diff --cached --quiet; then
            echo "Nessuna modifica da salvare"
          else
            git commit -m "Aggiorna risultati GW${{ steps.gw.outputs.gw }}"

            git pull --rebase origin main
            git push origin main
          fi

      - name: Prepara sito
        if: github.ref == 'refs/heads/main' && inputs.dry_run != true
        shell: bash
        run: |
          mkdir -p public
          cp dashboard.html public/index.html
          cp dashboard-data.js public/dashboard-data.js
          cp regolamento.html public/regolamento.html
          cp dashboard-v3.js public/dashboard-v3.js

      - name: Configura GitHub Pages
        if: github.ref == 'refs/heads/main' && inputs.dry_run != true
        uses: actions/configure-pages@v5

      - name: Carica sito Pages
        if: github.ref == 'refs/heads/main' && inputs.dry_run != true
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/main' && inputs.dry_run != true
    needs: calcola
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write

    steps:
      - name: Pubblica dashboard
        id: deployment
        uses: actions/deploy-pages@v4
