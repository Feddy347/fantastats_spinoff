name: Verifica dashboard con risultati definitivi
on:
  push:
    branches: [fix/gameweek-retrieval]
    paths:
      - 'test/dashboard-browser.mjs'
permissions:
  contents: read
  actions: read
jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: rebuild-season
          run-id: 45488174113
          github-token: ${{ github.token }}
          path: validated
      - run: |
          cp validated/fantastats_stagione.xlsx validated/statistiche_giocatori.xlsx .
          node genera-dashboard-data.js
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 >/tmp/dashboard-http.log 2>&1 &
          node test/dashboard-browser.mjs
