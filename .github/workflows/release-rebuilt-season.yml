name: Pubblica FantaStats V4 ufficiale
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-rebuilt-season.yml'
      - 'v4/**'
      - 'genera-dashboard-v4.js'
      - 'genera-dashboard-data.js'
      - 'test/v4-browser.mjs'
      - 'test/v4-optimizer.test.mjs'
      - 'regolamento.html'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: fantastats-official-pages
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Test unitari e sintassi
        run: |
          node --test test/matchday.test.js test/playerIdentity.test.js test/partialFs7.test.js test/v4-optimizer.test.mjs
          node --check v4/app.js
          node --check v4/optimizer.js
      - name: Genera V4 dagli Excel correnti senza ricalcolo
        run: |
          node genera-dashboard-v4.js
          cp serie-a-calendar.json regolamento.html v4/
      - name: Verifica tutti i dati e la navigazione
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
          python3 -m http.server 8765 --directory v4 >/tmp/v4-http.log 2>&1 &
          node test/v4-browser.mjs
      - name: Prepara sito ufficiale
        run: |
          mkdir -p public
          cp v4/index.html v4/app.js v4/style.css v4/optimizer.js public/
          cp -r v4/data public/data
          cp serie-a-calendar.json regolamento.html public/
          test -s public/data/core.json
          test -s public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
