name: Pubblicazione definitiva stagione ricostruita
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-rebuilt-season.yml'
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: release-rebuilt-season
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: rebuild-season
          run-id: 45488174113
          github-token: ${{ github.token }}
          path: validated
      - name: Ripristina esattamente gli Excel validati
        run: |
          cp validated/fantastats_stagione.xlsx validated/statistiche_giocatori.xlsx .
          node test/rebuild-preflight.js
          node --test test/matchday.test.js test/playerIdentity.test.js test/partialFs7.test.js
          node genera-dashboard-data.js
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Verifica browser prima della pubblicazione
        run: |
          python3 -m http.server 8765 >/tmp/dashboard-http.log 2>&1 &
          node test/dashboard-browser.mjs
      - name: Salva risultati definitivi su main
        run: |
          git config user.name "Fantastats Bot"
          git config user.email "actions@github.com"
          git add fantastats_stagione.xlsx statistiche_giocatori.xlsx dashboard-data.js
          git commit -m "Publish validated GW1-GW12 Excel and dashboard data"
          git push origin HEAD:refs/heads/main
      - name: Prepara sito ufficiale
        run: |
          mkdir -p public
          cp dashboard.html public/index.html
          cp dashboard-data.js dashboard-v3.js regolamento.html serie-a-calendar.json public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
