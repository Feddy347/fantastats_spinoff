name: Aggiorna listone - proposta verificabile
on:
  push:
    branches: [fix/gameweek-retrieval]
    paths:
      - 'Quotazioni_Fantacalcio_Stagione_2026_27.xlsx'
      - 'test/refresh-listone.js'
      - 'lib/sorare.js'
      - '.github/workflows/refresh-listone.yml'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Genera proposta listone e report
        env:
          SORARE_API_KEY: ${{ secrets.SORARE_API_KEY }}
        run: |
          if [[ -z "$SORARE_API_KEY" ]]; then
            echo "SORARE_API_KEY non configurata: uso query paginate anonime."
          else
            echo "SORARE_API_KEY configurata (valore non mostrato)."
          fi
          node test/refresh-listone.js
      - uses: actions/upload-artifact@v4
        with:
          name: proposta-listone
          path: listone-review/
          if-no-files-found: error
